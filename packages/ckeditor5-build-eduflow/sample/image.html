<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>CKEditor 5 – balloon block editor build – development sample</title>
	<style>
		body {
			max-width: 800px;
			margin: 20px auto;
			font-family: Arial, Helvetica, sans-serif;
		}
		.ck.ck-icon * {
			stroke: black
		}
	</style>
</head>
<body>

<h1>CKEditor 5 – balloon block editor build – development sample</h1>

<div id="editor">
	<figure class="image">
		<img src="../tests/manual/sample.jpg" alt="Autumn fields" />
	</figure>
</div>

<script src="../build/ckeditor.js"></script>
<script>
window.CKEDITOR.ClassicEditor.create( document.querySelector( '#editor' ), 
		{ 
			image: { toolbar:['linkImage'] }, 
			toolbar: [ 'insertAccordion', 'link' ],
			contentToolbar: [ 'insertAccordion', 'link' ]
		} )
		.then( editor => {
			window.editor = editor;
		} )
		.catch( error => {
			console.error( 'There was a problem initializing the editor.', error );
		} );
</script>

</body>
</html>
